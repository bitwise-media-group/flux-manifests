#
# Repo-local tasks: the stack validation harness. This file is included
# after common, so its same-named tasks replace common's whole-task. lint and
# fmt stay common's (license headers, prose, actionlint + zizmor, shell,
# kustomize/helm config scans); common's lint picks up the lint-kustomize
# replacement below by name.

[test]
description = "render + schema-validate the stack (kustomize build, substitution, resourceset render, kubeconform)"
run = "./scripts/validate.sh"

# Repo-local replacement for the toolchain's lint-kustomize: kubescape fatals
# on directories that contain ONLY custom resources it can't map (the
# entrypoints are a ResourceSet each; kyverno-policies and
# cert-manager-issuers are ClusterPolicy/ClusterIssuer only). Config
# coverage of the actual workloads lives in flux-containers (kubescape over
# each chart's rendered manifests); here we scan every component overlay
# except the named CR-only set.
[lint-kustomize]
hide = true
dir = "{{config_root}}"
env = { KUBESCAPE_SEVERITY = "{{vars.kubescape_severity}}" }
run = """
set -eu
export KUBECONFIG=/nonexistent
# Per-cloud overlays only: each builds its component in full (the overlay
# pulls in ../common), and the entrypoint trees are ResourceSet only.
for d in components/*/aws/ components/*/google/; do
  case "$(basename "$(dirname "$d")")" in
    cert-manager-issuers|cilium|flux|kyverno-policies|rbac|secret-sync) continue ;;
  esac
  echo "lint-kustomize: kubescape scan $d"
  if [ -f .kubescape/exceptions.json ]; then
    kubescape scan "$d" --logger warning --severity-threshold "${KUBESCAPE_SEVERITY:-high}" --exceptions .kubescape/exceptions.json
  else
    kubescape scan "$d" --logger warning --severity-threshold "${KUBESCAPE_SEVERITY:-high}"
  fi
done
"""

[ci]
description = "the checks the reusable CI workflow runs"
run = [{ task = "lint" }, { task = "test" }]

# common's pr is fmt + lint with no commit step; this one adds the harness.
[pr]
description = "full local gate before a pull request"
run = [{ task = "fmt" }, { task = "lint" }, { task = "test" }]
