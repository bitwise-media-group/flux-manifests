#
# flux-manifests consumes the shared toolchain (bitwise-media-group/toolchain)
# as the .mise/ submodule: mise loads its config.toml natively as
# .mise/config.toml (pinned tools -- kubescape, helm, shellcheck, actionlint,
# zizmor, prettier, markdownlint, addlicense, ... -- and the [vars] knob
# defaults), and this file selects the task files and pins the
# validation-only tools below. The repo has nothing to compile; the python
# archetype rides on top of common only because the repo also carries its
# documentation site (zensical.toml + docs/, built with Zensical via uv), and
# the Makefile is a thin forwarder (.mise/archetypes/python/include.mk). The
# validation task surface lives in tasks.toml.

[task_config]
# common (prose fmt/lint + license, container, shell and workflow lint), then
# the python archetype (docs site: sync, docs-build, serve, build), then the
# repo-local validation tasks; tasks.toml is included LAST so its same-named
# tasks (lint-kustomize, fmt, lint, test, ci, pr) win over both.
includes = [".mise/common/tasks.toml", ".mise/archetypes/python/tasks.toml", "tasks.toml"]

[tools]
# Validation tools the toolchain does not pin (candidates for upstreaming;
# locked in this repo's own mise.lock meanwhile — never run a repo-wide
# `mise upgrade`, it would write into the submodule).
"aqua:kubernetes-sigs/kustomize" = "5.7.1"
"aqua:yannh/kubeconform" = "0.8.0"
"aqua:mikefarah/yq" = "4.54.1"
# renders ResourceSets with sample inputs (`flux-operator build resourceset`)
"github:controlplaneio-fluxcd/flux-operator" = "v0.62.1"
