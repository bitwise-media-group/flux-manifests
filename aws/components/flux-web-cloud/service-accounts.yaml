# The identity the flux-web-auth sync runs as. The cluster module
# attaches an IRSA reader role scoped to ${SECRET_PREFIX}* -- IRSA rather
# than Pod Identity because the sync is podless (see the secret-sync
# component), and the role-arn annotation is how the AWS provider finds
# the role. The namespace/name pair is the contract with the cluster
# module. It rides this companion rather than the flux-web core because
# the sync in resourceset-secrets.yaml impersonates it -- the core
# depends on this Kustomization, so a core-owned account could never
# exist in time on a fresh cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-web-secrets
  namespace: flux-system
  annotations:
    eks.amazonaws.com/role-arn: ${SECRETS_ROLE_PREFIX}flux-system-flux-web-secrets
