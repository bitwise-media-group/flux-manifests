# The identities the secret syncs run as, one per consuming namespace.
# The cluster module attaches IRSA reader roles scoped to
# ${SECRET_PREFIX}* -- IRSA rather than Pod Identity because the syncs are
# podless (see the secret-sync component), and the role-arn annotations
# below are how the AWS provider finds each role; the secret VERSIONS are
# added out of band and never touch terraform state.
# The names are the contract with the cluster module -- change them
# together or the grants silently stop matching. They ride this companion
# rather than the patchy core because the syncs in resourceset-secrets.yaml
# impersonate them -- the core depends on this Kustomization, so
# core-owned accounts could never exist in time on a fresh cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchy-secrets
  namespace: patchy
  annotations:
    eks.amazonaws.com/role-arn: ${SECRETS_ROLE_PREFIX}patchy-patchy-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchy-secrets
  namespace: patchy-agents
  annotations:
    eks.amazonaws.com/role-arn: ${SECRETS_ROLE_PREFIX}patchy-agents-patchy-secrets
