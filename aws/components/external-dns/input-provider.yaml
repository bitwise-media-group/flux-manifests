apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: external-dns
  namespace: external-dns
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 30m
spec:
  type: "${ARTIFACT_TAG_PROVIDER}"
  url: oci://${PLATFORM_REGISTRY}/charts/external-dns
  filter:
    # Constraint order matters: kustomize drops the quotes, so the default
    # must not start with '>' or YAML reads it as a folded block scalar.
    semver: "${EXTERNAL_DNS_SEMVER:=<2.0.0 >=1.15.0}"
    limit: 1
---
# Copyright 2026 BitWise Media Group Ltd
# SPDX-License-Identifier: MIT
#
# The external-dns image rides its own release train: the mirror tracks it
# independently of the chart (flux-containers .images.track), so a fixed
# image can ship without a chart release. This provider follows the mirrored
# image tags — only soaked, scanned, signed tags ever reach the mirror — and
# the ResourceSet feeds the pick into the HelmRelease image.tag. Keep the
# range aligned with the track rule's release train.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: external-dns-image
  namespace: external-dns
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 30m
spec:
  type: "${ARTIFACT_TAG_PROVIDER}"
  url: oci://${PLATFORM_REGISTRY}/images/registry.k8s.io/external-dns/external-dns
  filter:
    semver: "${EXTERNAL_DNS_IMAGE_SEMVER:=<1.0.0 >=0.21.0}"
    limit: 1
