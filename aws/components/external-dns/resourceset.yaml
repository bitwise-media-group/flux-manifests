# external-dns publishes records for the platform Gateway's HTTPRoutes (the
# patchy webhook host) into the delegated Route53 zone — one deployment per
# enabled zone flavour, so split-horizon clusters run a second, private-zone
# instance alongside the primary. Zone access is
# ambient: the pinned ServiceAccount name carries a Pod Identity
# association with the Route53 change/read role, created by terraform.
# Records are owned per cluster (txtOwnerId) and policy=sync prunes records
# for deleted routes -- which is what makes cluster destroy/recreate land
# on the same domain with no manual DNS action.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: external-dns
  namespace: external-dns
spec:
  # Permute joins the chart and image providers into one input set (each
  # exports exactly one, so the product stays one) and namespaces every
  # provider's inputs under its normalized name: inputs.external_dns.*,
  # inputs.external_dns_image.*.
  inputStrategy:
    name: Permute
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: external-dns
    - kind: ResourceSetInputProvider
      name: external-dns-image
  # Everything rides resourcesTemplate: the verify block's SHAPE follows the
  # signing mode (keyed clusters verify against the cosign-pub Secret
  # rendered here from COSIGN_PUBLIC_KEY, keyless against the Fulcio
  # identities). Conditional membership of a map needs a text template.
  resourcesTemplate: |
    << $keyed := ne "${SIGNED_IDENTITY_KMS_KEY:=}" "" >>
    << if ne "${COSIGN_PUBLIC_KEY:=}" "" >>
    ---
    # The signing key's public half (published base64-encoded by terraform,
    # so it drops straight into data); source-controller verifies the chart
    # artifact against it in keyed mode.
    apiVersion: v1
    kind: Secret
    metadata:
      name: cosign-pub
      namespace: external-dns
    type: Opaque
    data:
      cosign.pub: ${COSIGN_PUBLIC_KEY:=}
    << end >>
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: external-dns
      namespace: external-dns
    spec:
      interval: 1h
      url: oci://${PLATFORM_REGISTRY}/charts/external-dns
      provider: "${OCI_PROVIDER}"
      ref:
        tag: << inputs.external_dns.tag >>
      verify:
        provider: cosign
        << if $keyed >>
        # Keyed: verified against the KMS signing key's public half.
        secretRef:
          name: cosign-pub
        << else >>
        # Keyless: the chart must carry a Fulcio certificate from the
        # flux-containers publish workflow. Single-quoted: the values are
        # regexes whose backslashes a double-quoted scalar would mangle.
        matchOIDCIdentity:
          - issuer: '${SIGNED_IDENTITY_ISSUER}'
            subject: '${SIGNED_IDENTITY_CHARTS}'
        << end >>
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      # -public/-private naming pairs each instance with the zone flavour
      # it owns; the chart names its resources after the release.
      name: external-dns-public
      namespace: external-dns
    spec:
      interval: 30m
      timeout: 5m
      chartRef:
        kind: OCIRepository
        name: external-dns
        namespace: external-dns
      values:
        image:
          repository: ${CONTAINER_REGISTRY}/images/registry.k8s.io/external-dns/external-dns
          # The mirror tracks this image independently of the chart; the
          # tag comes from the external-dns-image provider, not the
          # chart's appVersion default.
          tag: << inputs.external_dns_image.tag >>
        provider:
          name: aws
        # Pod Identity hands out credentials but not a region; the SDK
        # needs one to construct the Route53 client.
        env:
          - name: AWS_DEFAULT_REGION
            value: '${AWS_REGION}'
        # Only the delegated hosted zone is ever touched — and only the
        # PUBLIC flavour, which always exists (cert-manager's DNS-01 needs
        # it even on a fully internal cluster). The chart has no
        # zoneIdFilters value (that name is Bitnami's; this chart silently
        # drops unknown values), so the filters ride extraArgs. One
        # instance per zone flavour because a single instance cannot serve
        # split-horizon: the AWS provider flattens every matched zone into
        # one record view before planning, so a record present in either
        # flavour reads as present in both and the missing copy is never
        # created. The zone-type filter backs the id filter so the two
        # instances can never cross streams.
        extraArgs:
          - --zone-id-filter=${DNS_PUBLIC_ZONE_ID}
          - --aws-zone-type=public
        # Only the delegated zone's domain is ever touched.
        domainFilters:
          - ${DNS_DOMAIN}
        # Gateway API HTTPRoutes (patchy's webhook route) and Services.
        sources:
          - service
          - gateway-httproute
        # Per-cluster, per-flavour record ownership; sync (not upsert-only)
        # prunes records when routes go away, so recreation converges
        # cleanly.
        txtOwnerId: ${CLUSTER_NAME}-public
        policy: sync
        # The terraform identity grant binds external-dns/external-dns —
        # pin the name so the contract holds.
        serviceAccount:
          name: external-dns
        nodeSelector:
          role: system
    << if ne "${DNS_PRIVATE_ZONE_ID}" "" >>
    ---
    # Split-horizon second instance: the same records into the private
    # flavour. A separate release rather than a wider filter on the first —
    # the flattened-view planning above means each instance must see
    # exactly one zone for its plan to be computed against that zone alone.
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: external-dns-private
      namespace: external-dns
    spec:
      interval: 30m
      timeout: 5m
      chartRef:
        kind: OCIRepository
        name: external-dns
        namespace: external-dns
      values:
        image:
          repository: ${CONTAINER_REGISTRY}/images/registry.k8s.io/external-dns/external-dns
          tag: << inputs.external_dns_image.tag >>
        provider:
          name: aws
        env:
          - name: AWS_DEFAULT_REGION
            value: '${AWS_REGION}'
        # Pinned to the private flavour, id and zone type both — the
        # mirror of the primary release's public pin.
        extraArgs:
          - --zone-id-filter=${DNS_PRIVATE_ZONE_ID}
          - --aws-zone-type=private
        domainFilters:
          - ${DNS_DOMAIN}
        sources:
          - service
          - gateway-httproute
        # Ownership TXT records live per zone, so the suffix is legibility
        # rather than necessity: registry entries name the instance that
        # wrote them.
        txtOwnerId: ${CLUSTER_NAME}-private
        policy: sync
        # Reuses the public release's ServiceAccount: the terraform Pod
        # Identity association binds external-dns/external-dns once and
        # covers both deployments.
        serviceAccount:
          create: false
          name: external-dns
        nodeSelector:
          role: system
    << end >>
