# The platform's shared internet-facing Gateway. Cilium's Gateway API
# implementation materialises one LoadBalancer Service
# (cilium-gateway-platform), which the AWS Load Balancer Controller turns
# into an internet-facing NLB bound to the terraform-reserved Elastic IPs
# -- the infrastructure annotations propagate to that Service, carrying
# the allocation ids, the public subnets the NLB spans (one EIP per
# subnet, an NLB requirement), and the instance target type (the only
# type the controller supports under a non-VPC-CNI datapath -- see
# GATEWAY_NLB_TARGET_TYPE in terraform-aws-eks-flux).
#
# Cluster destroy/recreate serves the same addresses again, so DNS barely
# blips even before external-dns reconverges. Five listeners, one per
# hostname, each admitting routes only from its owning namespace:
# patchy's machine edge (integration-controller webhook receivers), human
# edge (status page) and evaluation API (evolve), the dex OIDC issuer,
# and the Flux status web UI. All terminate with the one patchy-tls
# certificate, which carries every name.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      # external = the AWS Load Balancer Controller reconciles this
      # Service (the in-tree provider must not race it for the NLB)
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ${GATEWAY_NLB_TARGET_TYPE}
      service.beta.kubernetes.io/aws-load-balancer-eip-allocations: ${GATEWAY_EIP_ALLOCATIONS}
      service.beta.kubernetes.io/aws-load-balancer-subnets: ${GATEWAY_SUBNETS}
  listeners:
    - name: https-integrations
      protocol: HTTPS
      port: 443
      hostname: integrations.${PATCHY_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: patchy-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: patchy
    - name: https-status
      protocol: HTTPS
      port: 443
      hostname: status.${PATCHY_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: patchy-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: patchy
    - name: https-evals
      protocol: HTTPS
      port: 443
      hostname: evals.${PATCHY_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: patchy-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: patchy
    - name: https-dex
      protocol: HTTPS
      port: 443
      hostname: dex.${PATCHY_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: patchy-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: dex
    - name: https-flux
      protocol: HTTPS
      port: 443
      hostname: flux.${PATCHY_DOMAIN}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: patchy-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: flux-system
