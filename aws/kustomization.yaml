#
# The aws tree's entrypoint: terraform points each cluster's FluxInstance
# sync.path at its cloud's tree root (flux.sync.path). Cloud-neutral
# components resolve into ./common/components; everything else lives under
# ./aws/components.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # flux managing flux: the operator + FluxInstance HelmReleases (adopted
  # from the terraform bootstrap) follow the newest mirrored charts
  - flux.yaml
  # cilium managing cilium: same adoption trick, one step behind the
  # gateway-api-crds Kustomization (see aws/cilium.yaml's dependsOn)
  - cilium.yaml
  - kyverno.yaml
  - kyverno-policies.yaml
  - cert-manager.yaml
  - cert-manager-issuers.yaml
  - external-dns.yaml
  - gateway.yaml
  - rbac.yaml
  # the optional tier (dex, flux-web, patchy) — elected via STACK_COMPONENTS
  - optional.yaml
