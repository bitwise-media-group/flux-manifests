# dex elected so the status-auth sync renders; claude on the anthropic
# provider so the broker-credential sync renders too. The aws dialect of
# every sync renders from the resourceset-secrets.aws.yaml variant.
- cloud: google
  components: dex,flux-web,patchy
  harnesses: claude
  claudeProvider: anthropic
