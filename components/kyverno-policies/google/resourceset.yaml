# Every pod image must carry a cosign signature from the platform publish
# workflow, except cloud-managed system images (the cloud signs and delivers
# those, not the platform pipeline). Image-based exclusion is deliberate:
# GKE system pods appear in kube-system, gmp-system and gke-managed-*
# namespaces, and new managed namespaces appear with cluster features - the
# registries are the stable contract. kube-system itself is additionally
# excluded at the webhook level by the kyverno chart defaults.
#
# An ImageValidatingPolicy (policies.kyverno.io, CEL), not the deprecated
# kyverno.io ClusterPolicy. The exclusion is matchImageReferences (whose
# expressions see the image as `ref`): `images`
# carries only the images it matches, so the system images never reach the
# validation, and required (on) fails any matched image no policy in the
# request verified -- the closure the platform rule exists for.
#
# It rides a ResourceSet because the attestor SHAPE follows the signing mode:
# keyless clusters trust the Fulcio identities, KMS-keyed clusters
# (SIGNED_IDENTITY_KMS_KEY set) resolve the signing key through the Cloud KMS
# API at admission - the terraform grants the kyverno controllers the
# verify permission on the key. Conditional membership needs a text
# template.
#
# One identity, no application carve-outs: an application whose images are
# signed elsewhere ships a policies.kyverno.io PolicyException in the kyverno
# namespace (the only one kyverno reads them from) exempting its own pods,
# beside its own ImageValidatingPolicy verifying them - so every image is
# still verified by exactly one policy, and the platform never learns an
# application's registry or signer. An image policy honours only
# whole-resource exceptions (one with images set is ignored), so the
# exemption is by pod, and the application's policy must close over every
# image in those pods.
#
# Signatures are cosign v3 sigstore bundles attached via the OCI referrers
# API; the image verifier detects and verifies them (tlog entry included)
# offline against the sigstore TUF trusted root. Registry auth is per-policy
# for this kind (no global credential helper): `google` uses the admission
# controller's Workload Identity grant on the platform registry.
#
# Digest rewriting stays off (mutateDigest defaults on for this kind): the
# action is cluster-var-driven and a digest mutation under Audit would
# change pods the policy is only meant to report on. verifyDigest follows
# suit - without the mutation, tag-referenced images carry no digest.
#
# KYVERNO_FAILURE_ACTION keeps its values: Audit (default) reports through
# PolicyReports, Enforce denies. Soak a fresh cluster, audit the reports,
# then flip it in terraform's flux.cluster_vars - no manifests release
# needed.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  resourcesTemplate: |
    # The KMS key is compared inline, not via spec.inputs: post-build
    # substitution turns an empty input into null, the key vanishes on
    # apply, and the template's missingkey=error fails the build.
    << $keyed := ne "${SIGNED_IDENTITY_KMS_KEY:=}" "" >>
    << $enforce := eq "${KYVERNO_FAILURE_ACTION:=Audit}" "Enforce" >>
    << $system := `ref.startsWith('registry.k8s.io/') || ref.startsWith('gke.gcr.io/') || ref.startsWith('gcr.io/gke-release/')` >>
    ---
    apiVersion: policies.kyverno.io/v1
    kind: ImageValidatingPolicy
    metadata:
      name: verify-platform-signature
    spec:
      validationActions:
        - << if $enforce >>Deny<< else >>Audit<< end >>
      failurePolicy: Fail
      webhookConfiguration:
        timeoutSeconds: 30
      matchConstraints:
        resourceRules:
          - apiGroups: [""]
            apiVersions: ["v1"]
            operations: ["CREATE", "UPDATE"]
            resources: ["pods"]
      # Every image but the cloud's own system images (registry.k8s.io;
      # GKE's managed images in gke.gcr.io and gcr.io/gke-release).
      matchImageReferences:
        - expression: >-
            !(<< $system >>)
      credentials:
        providers:
          - google
      attestors:
        - name: platform
          cosign:
            << if $keyed >>
            # Keyed: the signing key, resolved through the Cloud KMS API in
            # cosign's gcpkms URI scheme.
            key:
              kms: gcpkms://${SIGNED_IDENTITY_KMS_KEY}
            << else >>
            keyless:
              identities:
                - subjectRegExp: '${SIGNED_IDENTITY_IMAGES}'
                  issuerRegExp: '${SIGNED_IDENTITY_ISSUER}'
            << end >>
      validationConfigurations:
        required: true
        mutateDigest: false
        verifyDigest: false
      validations:
        - expression: >-
            (images.?containers.orValue([]) + images.?initContainers.orValue([]) + images.?ephemeralContainers.orValue([]))
            .all(image, verifyImageSignatures(image, [attestors.platform]) > 0)
          message: every image must carry the platform publish workflow's signature
