# AWS Secrets Manager -> the dex-env Secret, through the Secrets Store CSI
# driver's AWS provider plus the secret-sync component's
# secrets-store-sync-controller. Two kinds of credential ride in one
# Secret, exposed to dex as environment variables (dex expands $VAR in its
# config and reads staticClient secrets via secretEnv):
#
#   - dex-<id>-<field>: each connector's out-of-band credential fields
#     (arbitrary SSO federation, DEX_CONNECTORS carries id + secrets per
#     connector). Created out of band (an OAuth client cannot be
#     terraformed), versions added with `aws secretsmanager
#     put-secret-value`. The google connector's dex-google-client-id/
#     -secret/-admin-email is just one instance of this generic shape.
#   - dex-client-<id>: per-relying-party OAuth2 client secrets, one per
#     confidential DEX_CLIENTS entry, generated by terraform (ephemeral
#     random_password, write-only versions) beside the cluster. The same
#     containers are synced into each consumer's own namespace by that
#     consumer, so dex and its clients always agree.
#
# Template form so each entry syncs only when its source actually exists:
# a dex-client-<id> entry only for a declared confidential client (public
# clients have no secret), and a dex-<id>-<field> entry only when that
# connector and field are declared in DEX_CONNECTORS -- terraform never
# creates a container nothing declared, and an unconditional reference
# would wedge the sync.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: dex-secrets
  namespace: dex
spec:
  resourcesTemplate: |
    << $connectors := mustFromJson `${DEX_CONNECTORS:=[]}` >>
    << $clients := mustFromJson `${DEX_CLIENTS:=[]}` >>
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: dex-secrets
      namespace: dex
      annotations:
        # IRSA, not Pod Identity: the sync is podless (see the secret-sync
        # component), so the AWS provider resolves the reader role from this
        # annotation and assumes it with the KSA's OIDC token.
        eks.amazonaws.com/role-arn: ${SECRETS_ROLE_PREFIX}dex-dex-secrets
    ---
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: dex-env
      namespace: dex
    spec:
      provider: aws
      parameters:
        region: ${AWS_REGION}
        usePodIdentity: "false"
        objects: |
          << range $c := $connectors >>
          << range $field := $c.secrets >>
          - objectName: "${SECRET_PREFIX}dex-<< $c.id >>-<< $field >>"
            objectType: "secretsmanager"
            objectAlias: "<< $c.id >>-<< $field >>"
          << end >>
          << end >>
          << range $c := $clients >>
          << if not $c.public >>
          - objectName: "${SECRET_PREFIX}dex-client-<< $c.id >>"
            objectType: "secretsmanager"
            objectAlias: "client-<< $c.id >>"
          << end >>
          << end >>
    ---
    apiVersion: secret-sync.x-k8s.io/v1alpha1
    kind: SecretSync
    metadata:
      name: dex-env
      namespace: dex
    spec:
      serviceAccountName: dex-secrets
      secretProviderClassName: dex-env
      secretObject:
        type: Opaque
        # an empty list rather than a null key when nothing is declared -
        # the CRD wants an array, and an SSO-less-but-elected dex is legal
        data:<< if not (or $connectors $clients) >> []<< end >>
          << range $c := $connectors >>
          << range $field := $c.secrets >>
          - sourcePath: << $c.id >>-<< $field >>
            targetKey: << $c.id | upper >>_<< $field | upper | replace "-" "_" >>
          << end >>
          << end >>
          << range $c := $clients >>
          << if not $c.public >>
          - sourcePath: client-<< $c.id >>
            targetKey: DEX_CLIENT_<< $c.id | upper | replace "-" "_" >>
          << end >>
          << end >>
