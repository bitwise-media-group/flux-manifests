# Cloud Secret Manager -> the dex-env Secret, following the patchy
# secret-sync pattern (see components/patchy/resourceset-secrets.yaml for
# the CLOUD dialect branch: GKE Integrated Secret Synchronization on
# google, the Secrets Store CSI driver's AWS provider plus the secret-sync
# component's secrets-store-sync-controller on aws). Two kinds of
# credential ride in one Secret, exposed
# to dex as environment variables (dex expands $VAR in its config and reads
# staticClient secrets via secretEnv):
#
#   - dex-<id>-<field>: each connector's out-of-band credential fields
#     (arbitrary SSO federation, DEX_CONNECTORS carries id + secrets per
#     connector). Created out of band (an OAuth client cannot be
#     terraformed), versions added with `gcloud secrets versions add`;
#     containers and accessor grants live in the cloud-accounts patchy root
#     (secrets.tf). The google connector's dex-google-client-id/-secret/
#     -admin-email is just one instance of this generic shape.
#   - dex-client-*: per-relying-party OAuth2 client secrets, generated by
#     terraform (ephemeral random_password, write-only versions) in the
#     patchy-app root beside the cluster. The same containers are synced
#     into the consumer namespaces (flux-system, patchy), so dex and its
#     clients always agree.
#
# Template form so each entry syncs only when its source actually exists:
# a dex-client-* entry only when its relying party is elected in
# STACK_COMPONENTS, and a dex-<id>-<field> entry only when that connector
# and field are declared in DEX_CONNECTORS -- on a cluster without the
# consumer, terraform never creates the container and an unconditional
# reference would wedge the sync.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: dex-secrets
  namespace: dex
spec:
  inputs:
    - cloud: "${CLOUD:=google}"
      components: "${STACK_COMPONENTS:=dex,flux-web,patchy}"
  resourcesTemplate: |
    << $aws := eq inputs.cloud "aws" >>
    << $elected := splitList "," inputs.components >>
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: dex-secrets
      namespace: dex
    ---
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: dex-env
      namespace: dex
    spec:
      << if $aws >>
      provider: aws
      parameters:
        region: ${AWS_REGION}
        usePodIdentity: "true"
        objects: |
          << range $c := mustFromJson `${DEX_CONNECTORS:=[]}` >>
          << range $field := $c.secrets >>
          - objectName: "${SECRET_PREFIX}dex-<< $c.id >>-<< $field >>"
            objectType: "secretsmanager"
            objectAlias: "<< $c.id >>-<< $field >>"
          << end >>
          << end >>
          << if has "flux-web" $elected >>
          - objectName: "${SECRET_PREFIX}dex-client-flux-web"
            objectType: "secretsmanager"
            objectAlias: "client-flux-web"
          << end >>
          << if has "patchy" $elected >>
          - objectName: "${SECRET_PREFIX}dex-client-patchy-status"
            objectType: "secretsmanager"
            objectAlias: "client-patchy-status"
          << end >>
      << else >>
      provider: gke
      parameters:
        secrets: |
          << range $c := mustFromJson `${DEX_CONNECTORS:=[]}` >>
          << range $field := $c.secrets >>
          - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}dex-<< $c.id >>-<< $field >>/versions/latest"
            path: "<< $c.id >>-<< $field >>"
          << end >>
          << end >>
          << if has "flux-web" $elected >>
          - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}dex-client-flux-web/versions/latest"
            path: "client-flux-web"
          << end >>
          << if has "patchy" $elected >>
          - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}dex-client-patchy-status/versions/latest"
            path: "client-patchy-status"
          << end >>
      << end >>
    ---
    apiVersion: << ternary "secret-sync.x-k8s.io/v1alpha1" "secret-sync.gke.io/v1" $aws >>
    kind: SecretSync
    metadata:
      name: dex-env
      namespace: dex
    spec:
      serviceAccountName: dex-secrets
      secretProviderClassName: dex-env
      secretObject:
        type: Opaque
        data:
          << range $c := mustFromJson `${DEX_CONNECTORS:=[]}` >>
          << range $field := $c.secrets >>
          - sourcePath: << $c.id >>-<< $field >>
            targetKey: << $c.id | upper >>_<< $field | upper | replace "-" "_" >>
          << end >>
          << end >>
          << if has "flux-web" $elected >>
          - sourcePath: client-flux-web
            targetKey: DEX_CLIENT_FLUX_WEB
          << end >>
          << if has "patchy" $elected >>
          - sourcePath: client-patchy-status
            targetKey: DEX_CLIENT_PATCHY_STATUS
          << end >>
