# dex is the platform's OIDC identity provider: the patchy status page and
# the Flux status web UI both sign humans in through it. Upstream identity
# is arbitrary -- every connector dex config carries comes from the
# terraform-published DEX_CONNECTORS cluster var (a JSON array; see the
# connectors: block below), so a google connector's group membership via the
# Directory API is just one instance among any dex-supported connector type.
# When a google connector is used, its group membership comes from the
# Directory API keylessly -- the dex KSA is annotated with the
# terraform-created directory service account (common root dex.tf,
# domain-wide delegation), so Workload Identity signs the delegation
# assertion with no key file. The namespace/name/annotation triple below is
# the contract with local.dex_workload_identities in dex.tf -- change them
# together or the identity binding silently breaks.
#
# Template form rather than a plain resources list: each relying party's
# staticClient registers only when its component is elected in
# STACK_COMPONENTS (the client secret rides in via resourceset-secrets.yaml
# under the same guard).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: dex
  namespace: dex
spec:
  # Permute joins the chart and image providers into one input set (each
  # exports exactly one, so the product stays one) and namespaces every
  # provider's inputs under its normalized name: inputs.dex.*,
  # inputs.dex_image.*.
  inputStrategy:
    name: Permute
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: dex
    - kind: ResourceSetInputProvider
      name: dex-image
  resourcesTemplate: |
    << $elected := splitList "," "${STACK_COMPONENTS:=dex,flux-web,patchy}" >>
    << $keyed := ne "${SIGNED_IDENTITY_KMS_KEY:=}" "" >>
    << if ne "${COSIGN_PUBLIC_KEY:=}" "" >>
    ---
    # The signing key's public half (published base64-encoded by terraform,
    # so it drops straight into data); source-controller verifies the chart
    # artifact against it in keyed mode.
    apiVersion: v1
    kind: Secret
    metadata:
      name: cosign-pub
      namespace: dex
    type: Opaque
    data:
      cosign.pub: ${COSIGN_PUBLIC_KEY:=}
    << end >>
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: dex
      namespace: dex
    spec:
      interval: 1h
      url: oci://${PLATFORM_REGISTRY}/charts/dex
      provider: "${OCI_PROVIDER:=gcp}"
      ref:
        tag: << inputs.dex.tag >>
      verify:
        provider: cosign
        << if $keyed >>
        # Keyed: verified against the KMS signing key's public half.
        secretRef:
          name: cosign-pub
        << else >>
        matchOIDCIdentity:
          # single-quoted: the values are regexes whose backslashes a
          # double-quoted scalar would mangle when the rendered template
          # text is parsed
          - issuer: '${SIGNED_IDENTITY_ISSUER}'
            subject: '${SIGNED_IDENTITY_CHARTS}'
        << end >>
    ---
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: dex
      namespace: dex
    spec:
      interval: 30m
      timeout: 5m
      chartRef:
        kind: OCIRepository
        name: dex
        namespace: dex
      values:
        image:
          repository: ${CONTAINER_REGISTRY}/images/ghcr.io/dexidp/dex
          # The mirror tracks this image independently of the chart; the
          # tag comes from the dex-image provider, not the chart's
          # appVersion default.
          tag: << inputs.dex_image.tag >>
        # The terraform Workload Identity binding expects dex/dex annotated
        # with the directory SA -- pin the name so the contract holds. The
        # var is GKE-only (terraform-google-gke-flux publishes it, the aws
        # module does not), so it defaults empty and the annotation renders
        # as a flow mapping -- ABSENT rather than empty, same trick as the
        # patchy component's SCC_ASSET_SA -- on clusters without a google
        # connector's directory identity.
        serviceAccount:
          name: dex
          annotations: << if ne "${DEX_DIRECTORY_SA:=}" "" >>{"iam.gke.io/gcp-service-account":"${DEX_DIRECTORY_SA:=}"}<< else >>{}<< end >>
        # Credentials from the synced dex-env Secret
        # (resourceset-secrets.yaml). dex expands $VAR in its config;
        # $-refs below are deliberately brace-less so flux postBuild
        # substitution never touches them.
        envFrom:
          - secretRef:
              name: dex-env
        config:
          # The public URL, baked into every token's iss claim; served by
          # the platform Gateway via the httpRoute below.
          issuer: https://dex.${PATCHY_DOMAIN}
          # CRD-backed storage in the release namespace: no database to
          # run, and state survives pod restarts. dex creates its CRDs at
          # startup via the chart's RBAC.
          storage:
            type: kubernetes
            config:
              inCluster: true
          oauth2:
            # The relying parties are first-party platform UIs; a consent
            # screen between two internal pages is pure friction.
            skipApprovalScreen: true
          # Fully data-driven: DEX_CONNECTORS carries every connector's
          # {id, type, name, config} as JSON, published by the cluster
          # module's local.dex_connectors (sso.tf) -- config renders as a
          # single-line JSON value (a YAML subset), preserving real types
          # (lists, bools, numbers) coming through without hand-building
          # indented YAML from a generic map. Same trick as the patchy
          # component's modelMap (components/patchy/resourceset.yaml).
          # Backtick-quoted (a Go template raw string): JSON's own double
          # quotes would otherwise terminate the substituted string early.
          connectors:
            << range $c := mustFromJson `${DEX_CONNECTORS:=[]}` >>
            - type: << $c.type | quote >>
              id: << $c.id | quote >>
              name: << $c.name | quote >>
              config: << toJson $c.config >>
            << end >>
          << if or (has "flux-web" $elected) (has "patchy" $elected) >>
          # One static client per ELECTED relying party. The secrets are
          # the terraform-generated dex-client-* containers, synced here as
          # env vars and into each consumer's namespace -- both sides of
          # every pair read the same Secret Manager version.
          staticClients:
            << if has "flux-web" $elected >>
            - id: flux-web
              name: Flux Status
              secretEnv: DEX_CLIENT_FLUX_WEB
              redirectURIs:
                - https://flux.${PATCHY_DOMAIN}/oauth2/callback
            << end >>
            << if has "patchy" $elected >>
            - id: patchy-status
              name: Patchy Status
              secretEnv: DEX_CLIENT_PATCHY_STATUS
              redirectURIs:
                - https://status.${PATCHY_DOMAIN}/oauth2/callback
            << end >>
            << if and (has "patchy" $elected) (eq "${PATCHY_EVALUATION:=false}" "true") >>
            # The evolve CLI, for patchy's evaluation API: a PUBLIC client
            # (authorization-code + PKCE), so no secretEnv -- there is no
            # secret to mint or sync. No redirectURIs either: dex admits
            # loopback redirects on any port for public clients without
            # registration, which is exactly what a CLI's ephemeral local
            # callback server needs (a registered literal could never
            # match dex's exact-string comparison across ports).
            - id: evolve
              name: Evolve
              public: true
            << end >>
          << end >>
        httpRoute:
          enabled: true
          parentRefs:
            - name: platform
              namespace: gateway
              sectionName: https-dex
          hostnames:
            - dex.${PATCHY_DOMAIN}
        nodeSelector:
          role: system
