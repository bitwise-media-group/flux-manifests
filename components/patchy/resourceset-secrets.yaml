# The status page's OIDC sign-in against the platform dex, synced only when
# dex is elected in STACK_COMPONENTS — on a dex-less cluster terraform
# creates neither container and the status server runs rollups-only (see
# statusServer.auth in resourceset.yaml). Unlike the out-of-band
# credentials in secret-sync.yaml, both containers are terraform-authored
# in the patchy-app root: patchy-status-auth-config is the (secretless)
# auth config.yaml whose clientSecretFile points at the sibling key, and
# dex-client-patchy-status is the ephemeral-random client secret shared
# with dex's staticClient -- one Secret Manager version feeds both sides,
# so they cannot drift.
#
# The agent harness credentials ride here for the same reason: only the
# elected harnesses' containers exist, and a SecretProviderClass naming an
# absent container syncs nothing but errors forever. AGENT_HARNESSES is the
# same variable that enables the runners (agent.runners in resourceset.yaml).
# The claude credential -- formerly unconditional in secret-sync.yaml, in the
# agent namespace -- is since chart 0.10.0 consumed by the egress broker in
# the PATCHY namespace instead, and is doubly conditional: on the harness,
# and on the model provider being anthropic (a bedrock/vertex cluster
# authenticates with its cloud identity and needs no anthropic container at
# all). All three harness containers are out-of-band: terraform creates them
# in the cloud-accounts patchy root, the versions are added with `gcloud
# secrets versions add` and never touch state.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: patchy-secrets
  namespace: patchy
spec:
  inputs:
    - components: "${STACK_COMPONENTS:=dex,flux-web,patchy}"
      harnesses: "${AGENT_HARNESSES:=claude}"
      claudeProvider: "${CLAUDE_PROVIDER:=anthropic}"
  resourcesTemplate: |
    << if has "dex" (splitList "," inputs.components) >>
    ---
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: patchy-status-auth
      namespace: patchy
    spec:
      provider: gke
      parameters:
        secrets: |
          - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}patchy-status-auth-config/versions/latest"
            path: "config.yaml"
          - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}dex-client-patchy-status/versions/latest"
            path: "client-secret"
    ---
    apiVersion: secret-sync.gke.io/v1
    kind: SecretSync
    metadata:
      name: patchy-status-auth
      namespace: patchy
    spec:
      serviceAccountName: patchy-secrets
      secretProviderClassName: patchy-status-auth
      secretObject:
        type: Opaque
        data:
          - sourcePath: config.yaml
            targetKey: config.yaml
          - sourcePath: client-secret
            targetKey: client-secret
    << end >>
    << if and (has "claude" (splitList "," inputs.harnesses)) (eq inputs.claudeProvider "anthropic") >>
    ---
    # The Anthropic credential (a `claude setup-token` OAuth token), consumed
    # by the egress broker -- hence the patchy namespace, not patchy-agents;
    # the broker is its only consumer. Path/key api-key and Secret name
    # patchy-anthropic are the chart's defaults (egressBroker.anthropicSecret),
    # so neither is restated there.
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: patchy-anthropic
      namespace: patchy
    spec:
      provider: gke
      parameters:
        secrets: |
          - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}patchy-anthropic-token/versions/latest"
            path: "api-key"
    ---
    apiVersion: secret-sync.gke.io/v1
    kind: SecretSync
    metadata:
      name: patchy-anthropic
      namespace: patchy
    spec:
      serviceAccountName: patchy-secrets
      secretProviderClassName: patchy-anthropic
      secretObject:
        type: Opaque
        data:
          - sourcePath: api-key
            targetKey: api-key
    << end >>
    << if has "codex" (splitList "," inputs.harnesses) >>
    ---
    # The OpenAI platform API key the codex CLI authenticates with. Key name
    # api-key and Secret name patchy-openai are the chart's runner defaults
    # (agent.runners.codex.secret / .secretKey), so neither is restated there.
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: patchy-openai
      namespace: patchy-agents
    spec:
      provider: gke
      parameters:
        secrets: |
          - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}patchy-openai-token/versions/latest"
            path: "api-key"
    ---
    apiVersion: secret-sync.gke.io/v1
    kind: SecretSync
    metadata:
      name: patchy-openai
      namespace: patchy-agents
    spec:
      serviceAccountName: patchy-secrets
      secretProviderClassName: patchy-openai
      secretObject:
        type: Opaque
        data:
          - sourcePath: api-key
            targetKey: api-key
    << end >>
    << if has "copilot" (splitList "," inputs.harnesses) >>
    ---
    # The Copilot CLI's GitHub token -- the one agent credential that is not
    # a model API key, and the reason this harness ships off. It must be a
    # fine-grained token with NO repository permissions (the CLI rejects
    # classic PATs outright); it is deliberately a different container from
    # the patchy-github App credential, which the agent pods must never see.
    # Key name token and Secret name patchy-copilot are the chart's runner
    # defaults.
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: patchy-copilot
      namespace: patchy-agents
    spec:
      provider: gke
      parameters:
        secrets: |
          - resourceName: "projects/${GCP_PROJECT}/secrets/${SECRET_PREFIX}patchy-copilot-token/versions/latest"
            path: "token"
    ---
    apiVersion: secret-sync.gke.io/v1
    kind: SecretSync
    metadata:
      name: patchy-copilot
      namespace: patchy-agents
    spec:
      serviceAccountName: patchy-secrets
      secretProviderClassName: patchy-copilot
      secretObject:
        type: Opaque
        data:
          - sourcePath: token
            targetKey: token
    << end >>
