# The identities the secret syncs run as, one per consuming namespace. On
# GKE each KSA holds direct Workload Identity grants
# (roles/secretmanager.secretAccessor) created in the cloud-accounts patchy
# root beside the secret containers; on EKS the cluster module attaches Pod
# Identity reader roles scoped to ${SECRET_PREFIX}* instead. The names are
# the contract with both cluster modules -- change them together or the
# grants silently stop matching. Cloud-neutral, so they stay plain YAML;
# the SecretProviderClass/SecretSync pairs that reference them branch on
# CLOUD and live in resourceset-secrets.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchy-secrets
  namespace: patchy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patchy-secrets
  namespace: patchy-agents
