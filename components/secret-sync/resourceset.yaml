# The upstream secrets-store-sync-controller (kubernetes-sigs): the piece
# of the secret-sync machinery EKS does not ship. The
# aws-secrets-store-csi-driver-provider EKS add-on (terraform) bundles the
# Secrets Store CSI driver and the AWS provider; this controller supplies
# the SecretSync CRD (secret-sync.x-k8s.io/v1alpha1) and materialises each
# SecretSync's Secret WITHOUT a pod mounting a CSI volume -- the standalone
# sync GKE's Integrated Secret Synchronization provides natively, which is
# why this component exists only on CLOUD=aws (gated in
# components/optional/resourceset.yaml) and why the consuming
# Kustomizations (dex, flux-web, patchy) depend on it there.
#
# The controller impersonates each SecretSync's serviceAccountName: it
# requests that KSA's token with the pods.eks.amazonaws.com audience and
# hands it to the AWS provider, which exchanges it with the Pod Identity
# Agent -- so the reader identity is the CONSUMER's Pod Identity
# association (the *-secrets KSAs the cluster module associates with
# Secrets Manager reader roles), never this controller's own.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: secret-sync
  namespace: secret-sync
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: secret-sync
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: secret-sync
        namespace: secret-sync
      spec:
        interval: 1h
        url: oci://${PLATFORM_REGISTRY}/charts/secrets-store-sync-controller
        provider: "${OCI_PROVIDER:=gcp}"
        ref:
          tag: << inputs.tag >>
        verify:
          provider: cosign
          matchOIDCIdentity:
            # single-quoted: the values are regexes whose backslashes a
            # double-quoted scalar would mangle when parsed
            - issuer: '${SIGNED_IDENTITY_ISSUER}'
              subject: '${SIGNED_IDENTITY_CHARTS}'
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: secret-sync
        namespace: secret-sync
      spec:
        interval: 30m
        timeout: 5m
        chartRef:
          kind: OCIRepository
          name: secret-sync
          namespace: secret-sync
        # The SecretSync CRD ships in the chart's crds/ directory; keep it
        # tracking the chart on upgrade rather than helm's default skip.
        install:
          crds: CreateReplace
        upgrade:
          crds: CreateReplace
        values:
          image:
            repository: ${CONTAINER_REGISTRY}/images/registry.k8s.io/secrets-store-sync/controller
          # The audience the controller mints SecretSync KSA tokens with.
          # pods.eks.amazonaws.com is the Pod Identity token audience --
          # matching usePodIdentity: "true" in every SecretProviderClass
          # this stack authors, so the AWS provider can exchange the token
          # with the Pod Identity Agent for the KSA's association role.
          tokenRequestAudience:
            - audience: pods.eks.amazonaws.com
          # a small always-on singleton -> the system pool
          nodeSelector:
            role: system
        # The chart hardcodes its provider-socket hostPath to
        # /var/run/secrets-store-sync-providers, a directory of its own that
        # the AWS provider's DaemonSet never writes to; the provider
        # registers its socket in the Secrets Store CSI driver's providers
        # dir instead. No values knob exists, so point the volume at the
        # driver's dir -- the provider serves plain gRPC on that socket and
        # is happy with two clients. The test op pins the volume identity
        # so a chart reorder fails loudly instead of patching the wrong
        # volume.
        postRenderers:
          - kustomize:
              patches:
                - target:
                    kind: Deployment
                    name: secrets-store-sync-controller-manager
                  patch: |
                    - op: test
                      path: /spec/template/spec/volumes/0/name
                      value: providervol
                    - op: replace
                      path: /spec/template/spec/volumes/0/hostPath/path
                      value: /var/run/secrets-store-csi-providers
