# Let's Encrypt cluster issuers, DNS-01 against the delegated Route53 zone —
# pinned to the PUBLIC flavour: Let's Encrypt resolves the challenge TXT over
# public DNS, so under split-horizon the record must land in the public zone,
# never the private one shadowing it in-VPC (the controller's self-check
# resolves publicly too: --dns01-recursive-nameservers-only in the
# cert-manager component). A private-only zone cannot satisfy DNS-01 at all,
# so the empty id failing this render loudly is the right outcome there.
# No credential secretRef: ambient credentials solve the challenge (the
# controller's Pod Identity association with the Route53 change/read role,
# created by terraform, and ClusterIssuers may use ambient credentials by
# default). The staging issuer exists for cert debugging without burning
# prod rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - dns01:
          route53:
            region: ${AWS_REGION}
            hostedZoneID: ${DNS_PUBLIC_ZONE_ID}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - dns01:
          route53:
            region: ${AWS_REGION}
            hostedZoneID: ${DNS_PUBLIC_ZONE_ID}
