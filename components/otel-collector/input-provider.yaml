apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: otel-collector
  namespace: otel-collector
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 30m
spec:
  type: GARArtifactTag
  url: oci://${PLATFORM_REGISTRY}/charts/opentelemetry-collector
  filter:
    # Constraint order matters: kustomize drops the quotes, so the default
    # must not start with '>' or YAML reads it as a folded block scalar.
    semver: "${OTEL_SEMVER:=<1.0.0 >=0.130.0}"
    limit: 1
---
# Copyright 2026 BitWise Media Group Ltd
# SPDX-License-Identifier: MIT
#
# The -contrib collector image rides its own release train: the mirror
# tracks it independently of the chart (flux-containers .images.track), so
# a fixed image can ship without a chart release. This provider follows the
# mirrored image tags — only soaked, scanned, signed tags ever reach the
# mirror — and the ResourceSet feeds the pick into the HelmRelease
# image.tag. Keep the range aligned with the track rule's release train.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: otel-collector-image
  namespace: otel-collector
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 30m
spec:
  type: GARArtifactTag
  url: oci://${PLATFORM_REGISTRY}/images/ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  filter:
    semver: "${OTEL_IMAGE_SEMVER:=<1.0.0 >=0.158.0}"
    limit: 1
