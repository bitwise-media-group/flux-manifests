# The platform's shared internet-facing Gateway, branched on CLOUD:
#
#   google  a Google-managed global external Application Load Balancer (no
#           ingress controller pods), attaching the terraform-reserved
#           global static IP by name (NamedAddress).
#   aws     Cilium's Gateway API implementation materialises one
#           LoadBalancer Service (cilium-gateway-platform), which the AWS
#           Load Balancer Controller turns into an internet-facing NLB
#           bound to the terraform-reserved Elastic IPs — the
#           infrastructure annotations propagate to that Service, carrying
#           the allocation ids, the public subnets the NLB spans (one EIP
#           per subnet, an NLB requirement), and the instance target type
#           (the only type the controller supports under a non-VPC-CNI
#           datapath — see GATEWAY_NLB_TARGET_TYPE).
#
# Either way cluster destroy/recreate serves the same addresses again, so
# DNS barely blips even before external-dns reconverges. Five listeners,
# one per hostname, each admitting routes only from its owning namespace:
# patchy's machine edge (integration-controller webhook receivers), human
# edge (status page) and evaluation API (evolve), the dex OIDC issuer, and
# the Flux status web UI. All terminate with the one patchy-tls
# certificate, which carries every name.
#
# A ResourceSet rather than a plain manifest because the address mechanism's
# SHAPE follows the cloud (spec.addresses vs spec.infrastructure) —
# conditional membership of a map needs a text template.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: gateway
  namespace: gateway
spec:
  inputs:
    - cloud: "${CLOUD:=google}"
  resourcesTemplate: |
    << $aws := eq inputs.cloud "aws" >>
    ---
    apiVersion: gateway.networking.k8s.io/v1
    kind: Gateway
    metadata:
      name: platform
      namespace: gateway
    spec:
      << if $aws >>
      gatewayClassName: cilium
      infrastructure:
        annotations:
          # external = the AWS Load Balancer Controller reconciles this
          # Service (the in-tree provider must not race it for the NLB)
          service.beta.kubernetes.io/aws-load-balancer-type: external
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: '${GATEWAY_NLB_TARGET_TYPE:=instance}'
          service.beta.kubernetes.io/aws-load-balancer-eip-allocations: '${GATEWAY_EIP_ALLOCATIONS:=}'
          service.beta.kubernetes.io/aws-load-balancer-subnets: '${GATEWAY_SUBNETS:=}'
      << else >>
      gatewayClassName: gke-l7-global-external-managed
      addresses:
        # NamedAddress is the GKE mechanism for a pre-reserved global
        # static IP.
        - type: NamedAddress
          value: '${GATEWAY_ADDRESS_NAME:=}'
      << end >>
      listeners:
        - name: https-integrations
          protocol: HTTPS
          port: 443
          hostname: "integrations.${PATCHY_DOMAIN}"
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: patchy-tls
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  kubernetes.io/metadata.name: patchy
        - name: https-status
          protocol: HTTPS
          port: 443
          hostname: "status.${PATCHY_DOMAIN}"
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: patchy-tls
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  kubernetes.io/metadata.name: patchy
        - name: https-evals
          protocol: HTTPS
          port: 443
          hostname: "evals.${PATCHY_DOMAIN}"
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: patchy-tls
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  kubernetes.io/metadata.name: patchy
        - name: https-dex
          protocol: HTTPS
          port: 443
          hostname: "dex.${PATCHY_DOMAIN}"
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: patchy-tls
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  kubernetes.io/metadata.name: dex
        - name: https-flux
          protocol: HTTPS
          port: 443
          hostname: "flux.${PATCHY_DOMAIN}"
          tls:
            mode: Terminate
            certificateRefs:
              - kind: Secret
                name: patchy-tls
          allowedRoutes:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  kubernetes.io/metadata.name: flux-system
