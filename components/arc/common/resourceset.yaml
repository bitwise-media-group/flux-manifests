# Actions Runner Controller (ARC), the controller half only: the
# actions.github.com CRDs, the manager Deployment and its RBAC, watching
# every namespace. The runner scale sets themselves are application-level:
# an application ships a gha-runner-scale-set HelmRelease in its own
# namespace, with its own tag provider over the same ARC_SEMVER range
# (the two charts release in lockstep and a scale set cannot run against
# a different controller version), pointing controllerServiceAccount at
# arc-systems/arc-gha-rs-controller - the name this release yields.
#
# The manager image doubles as the listener image (the controller
# launches listeners with its own image), so the one mirrored image covers
# every listener pod a scale set creates. Upstream publishes the chart and
# the image unsigned: the mirror's own signature, verified below, is the
# first provenance anything in this path gets.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: arc
  namespace: arc-systems
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: arc
  # The OCIRepository rides resourcesTemplate rather than resources below
  # (flux-operator renders both and merges them) because the verify block's
  # SHAPE follows the signing mode: keyed clusters (SIGNED_IDENTITY_KMS_KEY
  # set) verify against the cosign-pub public-key Secret rendered here from
  # the COSIGN_PUBLIC_KEY cluster var, keyless clusters against the Fulcio
  # identities. Conditional membership of a map needs a text template.
  resourcesTemplate: |
    << $keyed := ne "${SIGNED_IDENTITY_KMS_KEY:=}" "" >>
    << if ne "${COSIGN_PUBLIC_KEY:=}" "" >>
    ---
    # The signing key's public half (published base64-encoded by terraform,
    # so it drops straight into data); source-controller verifies the chart
    # artifact against it in keyed mode.
    apiVersion: v1
    kind: Secret
    metadata:
      name: cosign-pub
      namespace: arc-systems
    type: Opaque
    data:
      cosign.pub: ${COSIGN_PUBLIC_KEY:=}
    << end >>
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: arc
      namespace: arc-systems
    spec:
      interval: 1h
      url: oci://${PLATFORM_REGISTRY}/charts/gha-runner-scale-set-controller
      provider: "${OCI_PROVIDER:=gcp}"
      ref:
        tag: << inputs.tag >>
      verify:
        provider: cosign
        << if $keyed >>
        # Keyed: verified against the KMS signing key's public half.
        secretRef:
          name: cosign-pub
        << else >>
        # Keyless: the chart must carry a Fulcio certificate from the
        # flux-containers publish workflow. Single-quoted: the values are
        # regexes whose backslashes a double-quoted scalar would mangle.
        matchOIDCIdentity:
          - issuer: '${SIGNED_IDENTITY_ISSUER}'
            subject: '${SIGNED_IDENTITY_CHARTS}'
        << end >>
  resources:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        # "arc": the release name is what the chart derives the controller
        # ServiceAccount name from (<release>-gha-rs-controller), which
        # every scale set's controllerServiceAccount must name.
        name: arc
        namespace: arc-systems
      spec:
        interval: 30m
        timeout: 5m
        chartRef:
          kind: OCIRepository
          name: arc
          namespace: arc-systems
        # The actions.github.com CRDs ship in the chart's crds/ directory;
        # keep them tracking the chart on upgrade rather than helm's
        # default skip - a scale set of a newer chart needs the newer CRD.
        install:
          crds: CreateReplace
        upgrade:
          crds: CreateReplace
        values:
          image:
            repository: ${CONTAINER_REGISTRY}/images/ghcr.io/actions/gha-runner-scale-set-controller
          # a small always-on singleton -> the system pool
          nodeSelector:
            role: system
          flags:
            # Cluster-wide: scale sets live in application namespaces the
            # platform does not know about.
            watchSingleNamespace: ""
