# gateway-access lets the platform Gateway's listener admit Grafana's
# HTTPRoute. The label is unconditional (a plain manifest cannot follow the
# election), but the route itself renders only while dex is elected, and
# nothing else in this namespace ships one.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    platform.bitwisemedia.uk/gateway-access: "true"
