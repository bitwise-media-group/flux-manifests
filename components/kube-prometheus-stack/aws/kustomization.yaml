# The aws overlay of the kube-prometheus-stack component: the cloud-neutral
# common tier plus what only exists on aws: which DNS add-on the cluster runs
# (values-cloud.yaml, read by the HelmRelease's valuesFrom), the monitors for
# cilium and karpenter (resourceset-monitors-aws.yaml), and karpenter's
# dashboards. cilium's dashboards come with its own chart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - values-cloud.yaml
  - resourceset-monitors-aws.yaml
# See common/kustomization.yaml for why these options.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configMapGenerator:
  # Karpenter's getting-started dashboards, fed by the karpenter
  # ServiceMonitor (job="karpenter", which the performance dashboard
  # filters on).
  - name: dashboards-karpenter
    namespace: monitoring
    files:
      - dashboards/karpenter-capacity.json
      - dashboards/karpenter-performance.json
    options:
      annotations:
        grafana_folder: Karpenter
