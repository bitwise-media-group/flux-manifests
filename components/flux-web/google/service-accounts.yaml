# The identity the flux-web-auth sync runs as. It holds a direct
# Workload Identity secretAccessor grant made beside the secret container.
# The namespace/name pair is the contract with the cluster module. It
# rides this companion rather than the flux-web core because the sync
# in resourceset-secrets.yaml impersonates it -- the core depends on this Kustomization, so a
# core-owned account could never exist in time on a fresh cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-web-secrets
  namespace: flux-system
