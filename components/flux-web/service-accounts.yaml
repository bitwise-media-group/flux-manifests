# The identity the flux-web-auth sync runs as. On GKE it holds a direct
# Workload Identity secretAccessor grant made beside the secret container;
# on EKS the cluster module attaches a Pod Identity reader role scoped to
# ${SECRET_PREFIX}*. The namespace/name pair is the contract with both
# cluster modules. Cloud-neutral, so it stays plain YAML; the
# SecretProviderClass/SecretSync pair that references it branches on CLOUD
# and lives in resourceset-secrets.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-web-secrets
  namespace: flux-system
