# The aws overlay of the flux-web component: the cloud-neutral core (the
# HTTPRoute and the flux-system namespace's gateway-access label) plus
# this cloud's secret-sync dialect for the Web Config document and the
# edge-admission policy for the operator pod (a CiliumNetworkPolicy
# admitting the Cilium Gateway's reserved ingress identity).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../common
  - service-accounts.yaml
  - resourceset-secrets.yaml
  - network-policy.yaml
