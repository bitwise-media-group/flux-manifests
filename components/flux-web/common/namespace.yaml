# flux-system already exists (the flux-operator bootstrap creates it);
# this component adopts it via server-side apply purely to stamp the
# gateway-access label the platform Gateway's listener selects route
# namespaces by, so the HTTPRoute beside this file attaches.
#
# prune: disabled is essential, not cosmetic: adoption makes this
# Kustomization the namespace's Flux owner, and without the marker
# un-electing flux-web would garbage-collect flux-system itself - the
# controllers, the FluxInstance, everything. With it, un-electing
# flux-web leaves the namespace (label included) in place.
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    platform.bitwisemedia.uk/gateway-access: "true"
    kustomize.toolkit.fluxcd.io/prune: disabled
