# The Flux status web UI's edge: flux.<domain> through the platform
# Gateway's wildcard listener to the flux-operator Service's web port. The
# route attaches by hostname (the listener admits every host under the
# served domain from a gateway-access-labelled namespace - see
# namespace.yaml beside this file). The route lives here rather than in
# the operator's helm values because the operator is bootstrapped by
# terraform before the Gateway exists; the platform owns everything that
# depends on its edge.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flux-web
  namespace: flux-system
spec:
  parentRefs:
    - name: platform
      namespace: gateway
  hostnames:
    - flux.${PLATFORM_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: flux-operator
          port: 9080
