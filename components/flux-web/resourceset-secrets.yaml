# The Flux status web UI's SSO configuration. flux-operator (bootstrapped
# by terraform, terraform-google-gke-flux / terraform-aws-eks-flux) is
# started with --web-config-secret-name=flux-web-auth and hot-reloads the
# Web Config API document from that Secret's config.yaml key. The operator
# requires the OAuth2 clientSecret INLINE in that document -- no file or
# env indirection -- so the whole config.yaml is composed by terraform in
# the patchy-app root (flux-web-auth-config container): the ephemeral
# random client secret is embedded there and never lands in terraform
# state (write-only version). dex's flux-web staticClient reads the same
# random from the sibling dex-client-flux-web container, so the pair
# cannot drift.
#
# Template form only for the CLOUD branch: the sync itself is
# unconditional with the component, but the sync dialect is the cluster's
# -- GKE Integrated Secret Synchronization on google, the Secrets Store
# CSI driver's AWS provider plus the secret-sync component's
# secrets-store-sync-controller on aws (see
# components/patchy/resourceset-secrets.yaml for the full picture).
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: flux-web-secrets
  namespace: flux-system
spec:
  inputs:
    - cloud: "${CLOUD:=google}"
  resourcesTemplate: |
    << $aws := eq inputs.cloud "aws" >>
    ---
    apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: flux-web-auth
      namespace: flux-system
    spec:
      << if $aws >>
      provider: aws
      parameters:
        region: ${AWS_REGION:=}
        usePodIdentity: "true"
        objects: |
          - objectName: "${SECRET_PREFIX}flux-web-auth-config"
            objectType: "secretsmanager"
            objectAlias: "config.yaml"
      << else >>
      provider: gke
      parameters:
        secrets: |
          - resourceName: "projects/${GCP_PROJECT:=}/secrets/${SECRET_PREFIX}flux-web-auth-config/versions/latest"
            path: "config.yaml"
      << end >>
    ---
    apiVersion: << ternary "secret-sync.x-k8s.io/v1alpha1" "secret-sync.gke.io/v1" $aws >>
    kind: SecretSync
    metadata:
      name: flux-web-auth
      namespace: flux-system
    spec:
      serviceAccountName: flux-web-secrets
      secretProviderClassName: flux-web-auth
      secretObject:
        type: Opaque
        data:
          - sourcePath: config.yaml
            targetKey: config.yaml
