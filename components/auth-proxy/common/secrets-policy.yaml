# Each proxy instance needs two random values that must stay put: the OAuth
# client secret it shares with dex, and the key that seals its session
# cookies (rotating it signs everyone out). Nothing in a Flux render can mint
# a value once and keep it -- a ResourceSet or kustomize render is
# deterministic -- so kyverno's background controller does: when an
# instance's trigger ConfigMap appears, it generates <name>-auth-proxy with
# client-id, client-secret and cookie-secret (the keys the chart's
# config.existingSecret reads) and never touches it again
# (synchronize: false). The DexClient registers the same client secret
# through its secretRef, so the pair cannot drift, and no secret ever lands
# in git, terraform state or a cloud secret store.
#
# To rotate an instance's secrets: delete its Secret and then its trigger
# ConfigMap; the ResourceSet recreates the trigger and kyverno mints fresh
# values (existing sessions end).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: auth-proxy-secrets
spec:
  rules:
    - name: mint-instance-secret
      match:
        any:
          - resources:
              kinds:
                - ConfigMap
              namespaces:
                - auth-proxy
              selector:
                matchLabels:
                  auth-proxy.platform.bitwisemedia.uk/trigger: "true"
      generate:
        # Also for triggers that predate the policy (a fresh cluster applies
        # both in one pass, in no guaranteed order).
        generateExisting: true
        synchronize: false
        apiVersion: v1
        kind: Secret
        name: "{{ request.object.metadata.name }}"
        namespace: auth-proxy
        data:
          type: Opaque
          metadata:
            labels:
              app.kubernetes.io/managed-by: kyverno
          data:
            client-id: "{{ base64_encode(join('', ['auth-proxy-', request.object.data.instance])) }}"
            client-secret: "{{ base64_encode(random('[a-zA-Z0-9]{48}')) }}"
            # 32 bytes: oauth2-proxy accepts a 16, 24 or 32-byte cookie
            # secret for AES.
            cookie-secret: "{{ base64_encode(random('[a-zA-Z0-9]{32}')) }}"
---
# The background controller may read and write Secrets in this namespace
# only (its chart role grants no Secret access anywhere), which is all the
# rule above needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-background-secrets
  namespace: auth-proxy
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-background-secrets
  namespace: auth-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-background-secrets
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
