# Each proxy instance needs two random values that must stay put: the OAuth
# client secret it shares with dex, and the key that seals its session
# cookies (rotating it signs everyone out). Nothing in a Flux render can mint
# a value once and keep it -- a ResourceSet or kustomize render is
# deterministic -- so kyverno's background controller does: when an
# instance's trigger ConfigMap is created, it generates <name>-auth-proxy
# with client-id, client-secret and cookie-secret (the keys the chart's
# config.existingSecret reads). The DexClient registers the same client
# secret through its secretRef, so the pair cannot drift, and no secret ever
# lands in git, terraform state or a cloud secret store.
#
# A NamespacedGeneratingPolicy (policies.kyverno.io, CEL): it can only
# trigger on, and generate into, this namespace. Mint-once is deliberate on
# three counts, because generating over an existing Secret REPLACES it (and
# so rotates both values):
#   - it triggers on CREATE only, so an update to the trigger never
#     re-generates;
#   - synchronize is off, so nothing reverts or re-derives the Secret;
#   - generateExisting covers a trigger created before the policy was
#     admitted (a fresh cluster applies both in one pass). It runs once,
#     when the policy is created -- deleting and recreating the policy
#     would therefore rotate every instance's secrets.
#
# To rotate an instance's secrets: delete its Secret and then its trigger
# ConfigMap; the ResourceSet recreates the trigger and kyverno mints fresh
# values (existing sessions end).
apiVersion: policies.kyverno.io/v1
kind: NamespacedGeneratingPolicy
metadata:
  name: auth-proxy-secrets
  namespace: auth-proxy
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["configmaps"]
  matchConditions:
    - name: trigger
      expression: >-
        object.metadata.?labels[?'auth-proxy.platform.bitwisemedia.uk/trigger'].orValue('') == 'true'
  variables:
    # stringData: the API server encodes it, so no base64 in CEL. 32 bytes
    # for the cookie: oauth2-proxy takes a 16, 24 or 32-byte AES key. Every
    # top-level value is dyn(): the object's fields are heterogeneous.
    - name: downstream
      expression: >-
        [
          {
            "apiVersion": dyn("v1"),
            "kind": dyn("Secret"),
            "metadata": dyn({
              "name": object.metadata.name,
              "labels": {"app.kubernetes.io/managed-by": "kyverno"}
            }),
            "type": dyn("Opaque"),
            "stringData": dyn({
              "client-id": "auth-proxy-" + string(object.data.instance),
              "client-secret": random("[a-zA-Z0-9]{48}"),
              "cookie-secret": random("[a-zA-Z0-9]{32}")
            })
          }
        ]
  # The namespaced kind's Apply takes no namespace: it always generates into
  # the policy's own.
  generate:
    - expression: generator.Apply(variables.downstream)
---
# The background controller may read and write Secrets in this namespace
# only (its chart role grants no Secret access anywhere), which is all the
# rule above needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-background-secrets
  namespace: auth-proxy
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-background-secrets
  namespace: auth-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-background-secrets
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
