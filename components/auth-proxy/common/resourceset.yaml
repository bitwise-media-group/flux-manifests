# The oauth2-proxy chart source every proxy instance shares
# (resourceset-upstreams.yaml renders one HelmRelease per upstream against
# it). A ResourceSet of its own because it follows the chart tag provider,
# while the instances follow the upstream providers: one input set each.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: oauth2-proxy
  namespace: auth-proxy
spec:
  inputsFrom:
    - kind: ResourceSetInputProvider
      name: oauth2-proxy
  # The verify block's SHAPE follows the signing mode (keyed clusters verify
  # against the cosign-pub Secret rendered here from COSIGN_PUBLIC_KEY,
  # keyless against the Fulcio identities): conditional membership of a map
  # needs a text template.
  resourcesTemplate: |
    << $keyed := ne "${SIGNED_IDENTITY_KMS_KEY:=}" "" >>
    << if ne "${COSIGN_PUBLIC_KEY:=}" "" >>
    ---
    # The signing key's public half (published base64-encoded by terraform,
    # so it drops straight into data); source-controller verifies the chart
    # artifact against it in keyed mode.
    apiVersion: v1
    kind: Secret
    metadata:
      name: cosign-pub
      namespace: auth-proxy
    type: Opaque
    data:
      cosign.pub: ${COSIGN_PUBLIC_KEY:=}
    << end >>
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: OCIRepository
    metadata:
      name: oauth2-proxy
      namespace: auth-proxy
    spec:
      interval: 1h
      url: oci://${PLATFORM_REGISTRY}/charts/oauth2-proxy
      # Registry auth (gcp = Artifact Registry via Workload Identity).
      provider: "${OCI_PROVIDER:=gcp}"
      ref:
        tag: << inputs.tag >>
      verify:
        provider: cosign
        << if $keyed >>
        # Keyed: verified against the KMS signing key's public half.
        secretRef:
          name: cosign-pub
        << else >>
        # Keyless: the chart must carry a Fulcio certificate from the
        # flux-containers publish workflow. Single-quoted: the values are
        # regexes whose backslashes a double-quoted scalar would mangle.
        matchOIDCIdentity:
          - issuer: '${SIGNED_IDENTITY_ISSUER}'
            subject: '${SIGNED_IDENTITY_CHARTS}'
        << end >>
