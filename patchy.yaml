# patchy's configuration for this repo: `patchy build` packages every
# component and the platform entrypoint as Flux OCI artifacts. Only the build
# block lives here. The registries and the signing config are never committed:
# the release workflow's patchy-publish step (bitwise-media-group/github-workflows)
# writes them from org variables as a lower config layer, and `make build`
# (`patchy build --all --dry-run`) needs neither.

scan:
  # Nothing here is an image, and a component directory is unrendered
  # kustomize (several are custom resources only, which kubescape cannot
  # scan). Configuration scanning runs over the rendered per-cloud overlays in
  # lint-kustomize instead, and the workloads' charts are scanned in
  # flux-containers.
  enabled: false

build:
  # Every tag is immutable; a channel is its newest build, followed by semver
  # range (terraform-*-flux "release channels"):
  #   edge    <next version>-edge.<UTC yyyymmddhhmmss>.g<short commit>, every
  #           push to main that cuts no release (the next version is the open
  #           release pull request's)
  #   stable  vX.Y.Z, added to the newest X.Y.Z edge build when the release is
  #           cut (patchy build promote), never rebuilt
  # VERSION, GIT_COMMIT and SOURCE_DATE_EPOCH (whose commit time the timestamp
  # is) come from git, through the containers archetype locally and the
  # patchy-publish step in CI. Artifacts are deterministic: one tree, source
  # and revision always has one digest.
  tags:
    - "${VERSION}-edge.${PATCHY_TIMESTAMP}.g${GIT_COMMIT:0:7}"
    - "sha-${GIT_COMMIT}"
  # Entries publish in order: every component before the entrypoint, so a
  # new platform build never references a component build that is not there
  # yet. scripts/validate.sh fails when a component is missing here.
  manifests:
    - name: arc
      repository: manifests/arc
      path: components/arc
      source: https://github.com/bitwise-media-group/flux-manifests
      revision: "main@sha1:${GIT_COMMIT}"
    - name: aws-load-balancer-controller
      repository: manifests/aws-load-balancer-controller
      path: components/aws-load-balancer-controller
      source: https://github.com/bitwise-media-group/flux-manifests
      revision: "main@sha1:${GIT_COMMIT}"
    - name: cert-manager
      repository: manifests/cert-manager
      path: components/cert-manager
      source: https://github.com/bitwise-media-group/flux-manifests
      revision: "main@sha1:${GIT_COMMIT}"
    - name: cert-manager-issuers
      repository: manifests/cert-manager-issuers
      path: components/cert-manager-issuers
      source: https://github.com/bitwise-media-group/flux-manifests
      revision: "main@sha1:${GIT_COMMIT}"
    - name: cilium
      repository: manifests/cilium
      path: components/cilium
      source: https://github.com/bitwise-media-group/flux-manifests
      revision: "main@sha1:${GIT_COMMIT}"
    - name: dex
      repository: manifests/dex
