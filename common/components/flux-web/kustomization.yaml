#
# The flux-web-auth secret sync (and its flux-web-secrets ServiceAccount),
# plus each cloud's edge-admission network policy for the operator pod
# (GFE ranges + health-check policy on google, the Gateway entity on aws),
# live in the per-cloud flux-web-cloud companion component, which this
# core's emitted Kustomization depends on -- so the SSO config Secret
# exists before the operator looks for it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - httproute.yaml
