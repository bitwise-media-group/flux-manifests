#
# The secret syncs (with their patchy-secrets ServiceAccounts), the mocked
# CMDB ConfigMap, and the GKE health-check policies live in the per-cloud
# patchy-cloud companion component (aws/google), which the emitted patchy
# Kustomization depends on -- so the credentials exist before the release
# reconciles. The companion writes into the patchy/patchy-agents namespaces
# terraform pre-creates (flux.namespaces); this core adopts them below to
# stamp the Pod Security labels.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - input-provider.yaml
  - resourceset.yaml
