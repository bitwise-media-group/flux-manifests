# Publish - push the released platform as OCI artifacts (one image per
# component plus the entrypoint, components first) to every platform
# registry, sign each digest keylessly, and move the `staging` channel tag.
# Runs when release-please cuts a release (App-authored, so the event fires);
# clusters syncing `staging` pick the new version up on their next reconcile,
# and `stable` clusters wait for promote.yaml.
#
# The job's GitHub OIDC token mints the GCP access token (via Workload
# Identity Federation, impersonating the manifest-publisher service account
# the artifact-store terraform created - its trust admits exactly refs/tags/v*
# of this repo), the AWS credentials (the artifact-store module's
# manifest_publishers role for this repo, when the org has an AWS platform
# registry) and the Fulcio signing certificate. The FluxInstance verify patch
# and every platform-<component> OCIRepository on every cluster pin this
# workflow's tag identity
# (.../flux-manifests/.github/workflows/publish.yaml@refs/tags/v*).
name: Publish Manifests

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # WIF / AWS OIDC token exchange + cosign keyless all ride the job's OIDC token
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the artifact is built from the release tag, not a branch head
          ref: ${{ github.event.release.tag_name }}

      - name: install flux CLI
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          # artifact-store module outputs, mirrored as org-level Actions variables
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MANIFEST_PUBLISHER_SA }}
          token_format: access_token

      - name: login to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PLATFORM_REGISTRY: ${{ vars.PLATFORM_REGISTRY }}
        run: |
          # writes ~/.docker/config.json - the keychain flux push and cosign both read
          docker login "${PLATFORM_REGISTRY%%/*}" --username oauth2accesstoken --password-stdin <<<"$ACCESS_TOKEN"

      # The AWS platform registry, gated on the org variable: an org without
      # an AWS artifact store publishes to Artifact Registry alone.
      - name: authenticate to AWS
        if: vars.AWS_MANIFEST_PUBLISHER_ROLE != ''
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ vars.AWS_MANIFEST_PUBLISHER_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: login to ECR
        if: vars.AWS_MANIFEST_PUBLISHER_ROLE != ''
        env:
          AWS_PLATFORM_REGISTRY: ${{ vars.AWS_PLATFORM_REGISTRY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login "${AWS_PLATFORM_REGISTRY%%/*}" --username AWS --password-stdin

      - name: push, sign, move staging
        env:
          PLATFORM_REGISTRY: ${{ vars.PLATFORM_REGISTRY }}
          AWS_PLATFORM_REGISTRY: ${{ vars.AWS_MANIFEST_PUBLISHER_ROLE != '' && vars.AWS_PLATFORM_REGISTRY || '' }}
          TAG: ${{ github.event.release.tag_name }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          export REGISTRIES="${PLATFORM_REGISTRY}${AWS_PLATFORM_REGISTRY:+ ${AWS_PLATFORM_REGISTRY}}"
          version="${TAG#v}"

          # every component, then the entrypoint; each digest signed before
          # the next push (see scripts/publish.sh)
          ./scripts/publish.sh push "$version" "$TAG@sha1:$GITHUB_SHA"
          ./scripts/publish.sh tag "$version" staging

          {
            echo "## Published platform $version"
            echo
            echo "- registries: \`$REGISTRIES\`"
            echo "- channel: \`staging\`"
          } >> "$GITHUB_STEP_SUMMARY"
