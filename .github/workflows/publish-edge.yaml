# Publish Edge - push every merge to main as the `edge` channel (one image
# per component plus the entrypoint), signed keylessly like the release
# channels. Dev/sandbox clusters syncing `edge` validate trunk continuously;
# `staging` and `stable` still only ever see release-tagged artifacts
# (publish.yaml / promote.yaml).
#
# The push lands on `edge-next` and is signed there; only then does the
# `edge` tag move onto the same digests. A cluster following `edge` can
# therefore never pull an artifact whose signature is not yet attached
# (which used to fail verification until the next run replaced it).
#
# This is a separate workflow file on purpose: the Fulcio certificate subject
# is the workflow path + ref, so edge artifacts are signed as
# .../flux-manifests/.github/workflows/publish-edge.yaml@refs/heads/main -
# a distinct identity that edge clusters pin, while the release channels'
# verify patches keep matching only publish.yaml@refs/tags/v*. The
# manifest-publisher service account's WIF trust (and the AWS role's OIDC
# trust) admit this workflow via the refs/heads/main subject binding in the
# artifact-store terraform.
name: Publish Edge Manifests

on:
  push:
    branches: [main]

permissions: {}

# serialise edge publishes so an older commit can never overwrite the tag
# after a newer one; cancel-in-progress stays off so a run is never killed
# between push and sign
concurrency:
  group: publish-edge
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # WIF / AWS OIDC token exchange + cosign keyless all ride the job's OIDC token
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install flux CLI
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          # artifact-store module outputs, mirrored as org-level Actions variables
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_MANIFEST_PUBLISHER_SA }}
          token_format: access_token

      - name: login to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PLATFORM_REGISTRY: ${{ vars.PLATFORM_REGISTRY }}
        run: |
          # writes ~/.docker/config.json - the keychain flux push and cosign both read
          docker login "${PLATFORM_REGISTRY%%/*}" --username oauth2accesstoken --password-stdin <<<"$ACCESS_TOKEN"

      # The AWS platform registry, gated on the org variable: an org without
      # an AWS artifact store publishes to Artifact Registry alone.
      - name: authenticate to AWS
        if: vars.AWS_MANIFEST_PUBLISHER_ROLE != ''
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_MANIFEST_PUBLISHER_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: login to ECR
        if: vars.AWS_MANIFEST_PUBLISHER_ROLE != ''
        env:
          AWS_PLATFORM_REGISTRY: ${{ vars.AWS_PLATFORM_REGISTRY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login "${AWS_PLATFORM_REGISTRY%%/*}" --username AWS --password-stdin

      - name: push and sign edge-next, then move edge
        env:
          PLATFORM_REGISTRY: ${{ vars.PLATFORM_REGISTRY }}
          AWS_PLATFORM_REGISTRY: ${{ vars.AWS_MANIFEST_PUBLISHER_ROLE != '' && vars.AWS_PLATFORM_REGISTRY || '' }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          export REGISTRIES="${PLATFORM_REGISTRY}${AWS_PLATFORM_REGISTRY:+ ${AWS_PLATFORM_REGISTRY}}"

          # no version tag: edge tracks the main head directly, and the
          # revision carries the exact commit for forensics
          ./scripts/publish.sh push edge-next "main@sha1:$GITHUB_SHA"
          ./scripts/publish.sh tag edge-next edge

          {
            echo "## Published platform edge"
            echo
            echo "- registries: \`$REGISTRIES\`"
            echo "- revision: \`main@sha1:$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
