# The flux-manifests documentation site (Zensical via uv). Not a Python
# package: no [build-system]. The toolchain's docs-build runs `zensical build`,
# in ci and pr and in the org release workflow's docs job.
[project]
name = "flux-manifests-docs"
version = "0.1.0"
description = "Documentation site for the BitWise Media Group flux-manifests platform, built with Zensical."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BitWise Media Group Ltd.", email = "oss@bitwisemedia.uk" }]
dependencies = [
  "zensical>=0.0.69",
]
